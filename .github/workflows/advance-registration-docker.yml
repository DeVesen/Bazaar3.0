name: Advance Registration - Build & Publish Docker Images

on:
  push:
    branches: [master]
    paths:
      - 'src/advance-registration/**'
      - '.github/workflows/advance-registration-docker.yml'
  workflow_dispatch: {}

env:
  DOCKERHUB_BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bazaar-advance-registration-backend
  DOCKERHUB_FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bazaar-advance-registration-frontend

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/advance-registration/backend/global.json

      - name: Restore & Build (BAR.Host)
        working-directory: src/advance-registration/backend
        run: |
          dotnet restore BAR.slnx
          dotnet build BAR.slnx --no-restore --configuration Release

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: src/advance-registration/backend
          file: src/advance-registration/backend/BAR.Host/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_BACKEND_IMAGE }}:latest
            ${{ env.DOCKERHUB_BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/advance-registration/frontend/BAR.App/package-lock.json

      - name: Install dependencies
        working-directory: src/advance-registration/frontend/BAR.App
        run: npm ci

      - name: Build (ng build)
        working-directory: src/advance-registration/frontend/BAR.App
        run: npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: src/advance-registration/frontend/BAR.App
          file: src/advance-registration/frontend/BAR.App/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_FRONTEND_IMAGE }}:latest
            ${{ env.DOCKERHUB_FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
