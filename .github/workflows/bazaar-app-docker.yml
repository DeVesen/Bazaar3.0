name: Bazaar App - Build & Publish Docker Images

on:
  push:
    branches: [master]
    paths:
      - 'src/bazaar-app/**'
      - '.github/workflows/bazaar-app-docker.yml'
  workflow_dispatch: {}

env:
  DOCKERHUB_BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bazaar-app-backend
  DOCKERHUB_FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bazaar-app-frontend

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build (Bazaar.Api)
        working-directory: src/bazaar-app/backend
        run: |
          dotnet restore Bazaar.slnx
          dotnet build Bazaar.slnx --no-restore --configuration Release

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: src/bazaar-app/backend
          file: src/bazaar-app/backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_BACKEND_IMAGE }}:latest
            ${{ env.DOCKERHUB_BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=bazaar-app-backend
          cache-to: type=gha,mode=max,scope=bazaar-app-backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/bazaar-app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/bazaar-app/frontend
        run: npm ci

      - name: Build (ng build)
        working-directory: src/bazaar-app/frontend
        run: npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: src/bazaar-app/frontend
          file: src/bazaar-app/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_FRONTEND_IMAGE }}:latest
            ${{ env.DOCKERHUB_FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=bazaar-app-frontend
          cache-to: type=gha,mode=max,scope=bazaar-app-frontend
