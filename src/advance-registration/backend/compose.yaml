services:

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bar
      POSTGRES_USER: bar
      # Kein Hardcode-Secret: aus .env oder Shell-Umgebung (VPROJ-S02 AC-7).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
    ports:
      - "5432:5432"
    volumes:
      - bar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bar -d bar"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: bar-backend
    build:
      context: .
      dockerfile: BAR.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # Name laut VPROJ-S04 AC-2 verbindlich: DefaultConnection.
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=bar;Username=bar;Password=${POSTGRES_PASSWORD}"
    ports:
      - "5001:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  bar-db-data:
