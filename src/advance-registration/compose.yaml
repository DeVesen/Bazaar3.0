services:

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bar
      POSTGRES_USER: bar
      # Kein Hardcode-Secret: aus .env oder Shell-Umgebung (VPROJ-S02 AC-7).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
    ports:
      - "6892:5432"
    volumes:
      - bar-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bar -d bar"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: devesen/bazaar-advance-registration-backend:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      # Name laut VPROJ-S04 AC-2 verbindlich: DefaultConnection.
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=bar;Username=bar;Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY muss gesetzt sein (min. 32 Zeichen)}
      Frontend__BaseUrl: "http://localhost:6891"
    ports:
      - "6890:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: devesen/bazaar-advance-registration-frontend:latest
    ports:
      - "6891:80"
    depends_on:
      - api

volumes:
  bar-db-data:
