<p-dialog
  [(visible)]="visibleModel"
  [modal]="true"
  header="Neuen Verkäufer anlegen"
  [style]="{ width: '940px', maxWidth: '90vw' }"
>
  <div class="panel-block">
    <div class="panel-block__title">Personendaten</div>
    <div class="form-grid">
      <div>
        <label for="create-first-name">Vorname *</label>
        <input id="create-first-name" pInputText [pAutoFocus]="true" [(ngModel)]="firstNameModel" />
      </div>
      <div>
        <label for="create-last-name">Nachname *</label>
        <input id="create-last-name" pInputText [(ngModel)]="lastNameModel" />
      </div>
    </div>
  </div>

  <div class="panel-block">
    <div class="panel-block__title">Kontakt</div>
    <div class="form-grid">
      <div class="full">
        <label for="create-address">Anschrift</label>
        <input id="create-address" pInputText [(ngModel)]="addressModel" />
      </div>
      <div>
        <label for="create-postal-code">PLZ *</label>
        <input id="create-postal-code" pInputText [(ngModel)]="postalCodeModel" />
      </div>
      <div>
        <label for="create-city">Ort *</label>
        <input id="create-city" pInputText [(ngModel)]="cityModel" />
      </div>
      <div>
        <label for="create-phone">Telefon *</label>
        <input id="create-phone" pInputText [(ngModel)]="phoneModel" />
      </div>
      <div>
        <label for="create-email">E-Mail (= Login) *</label>
        <input id="create-email" pInputText type="email" [(ngModel)]="emailModel" />
      </div>
    </div>
  </div>

  <div class="panel-block">
    <div class="panel-block__title">Konditionen</div>
    <div class="form-grid">
      <div class="full">
        <label for="create-seller-type">Verkäufer-Typ *</label>
        <p-select
          id="create-seller-type"
          [options]="sellerTypes()"
          optionLabel="name"
          optionValue="id"
          [(ngModel)]="sellerTypeIdModel"
        />
      </div>
    </div>
    @if (selectedType(); as type) {
      <p>Provision: {{ type.commissionRate }} % · Gebühr: {{ type.itemFee }} € pro Stück</p>
    }
  </div>

  <div class="panel-block">
    <div class="panel-block__title">Nummernblock</div>
    <div class="form-grid">
      <div>
        <label for="create-start-number">Startnummer</label>
        <p-inputnumber id="create-start-number" [useGrouping]="false" [(ngModel)]="startNumberModel" />
      </div>
      <div>
        <label for="create-block-count">Anzahl initialer Blöcke</label>
        <p-inputnumber id="create-block-count" [useGrouping]="false" [(ngModel)]="blockCountModel" />
      </div>
    </div>
  </div>

  @if (formError()) {
    <p class="field-error">{{ formError() }}</p>
  }

  <div class="dialog-footer">
    <button pButton type="button" [text]="true" severity="secondary" (click)="cancel()">Abbrechen</button>
    <button pButton type="button" [disabled]="!canSubmit()" (click)="submit()">Speichern</button>
  </div>
</p-dialog>
