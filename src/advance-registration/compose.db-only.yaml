services:

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bar
      POSTGRES_USER: bar
      POSTGRES_PASSWORD: bar
    ports:
      - "6543:5432"
    volumes:
      - bar-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bar -d bar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bar-db-data:
