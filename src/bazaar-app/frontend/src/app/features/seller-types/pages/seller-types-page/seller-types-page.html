<app-page title="Verkäufer-Typen">
  <div class="seller-types-page__toolbar">
    @if (canAdd()) {
      <p-button
        icon="pi pi-plus"
        ariaLabel="Neuer Verkäufer-Typ"
        pTooltip="Neuer Verkäufer-Typ"
        (onClick)="onRowAdd()"
      />
    }

    <p-iconfield class="seller-types-page__search">
      <p-inputicon class="pi pi-search" />
      <input
        pInputText
        type="text"
        placeholder="Suche nach Name …"
        aria-label="Suche nach Name"
        [ngModel]="searchTerm()"
        (ngModelChange)="onSearchChange($event)"
      />
    </p-iconfield>
  </div>

  <app-table
    [columns]="columns"
    [data]="rows()"
    [loading]="loading()"
    [actionColumn]="actionColumn()"
    [emptyText]="emptyText()"
    (sortChange)="onSortChange($event)"
    (actionClick)="onActionClick($event)"
  />
</app-page>

<app-typ-popup
  [visible]="popupVisible()"
  (visibleChange)="popupVisible.set($event)"
  [mode]="popupMode()"
  [initialValue]="popupInitialValue()"
  [saving]="saving()"
  [serverErrors]="serverErrors()"
  (save)="onPopupSave($event)"
  (cancel)="onPopupCancel()"
/>
