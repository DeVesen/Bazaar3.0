<app-page title="Artikel">
<div class="articles-page">
  <p-toolbar class="articles-page__filterbar">
    <ng-template #center>
      <p-iconfield class="articles-page__search">
        <p-inputicon class="pi pi-search" />
        <input
          pInputText
          type="text"
          placeholder="Suche nach Nr., Bezeichnung …"
          [ngModel]="qInput()"
          (ngModelChange)="onQInputChange($event)"
        />
      </p-iconfield>
    </ng-template>
    <ng-template #end>
      <p-select
        class="articles-page__select"
        [options]="brandOptions()"
        optionLabel="label"
        optionValue="value"
        [ngModel]="filters().brand"
        (ngModelChange)="onBrandChange($event)"
        [showClear]="true"
        placeholder="Alle"
        aria-label="Marke"
      />
      <p-select
        class="articles-page__select"
        [options]="categoryOptions()"
        optionLabel="label"
        optionValue="value"
        [ngModel]="filters().category"
        (ngModelChange)="onCategoryChange($event)"
        [showClear]="true"
        placeholder="Alle"
        aria-label="Kategorie"
      />
      <p-select
        class="articles-page__select"
        [options]="statusOptions"
        optionLabel="label"
        optionValue="value"
        [ngModel]="filters().status"
        (ngModelChange)="onStatusChange($event)"
        [showClear]="true"
        placeholder="Alle"
        aria-label="Status"
      />
    </ng-template>
  </p-toolbar>

  <app-table
    [lazy]="true"
    [rows]="pageSize()"
    [columns]="columns"
    [actionColumn]="actionColumn()"
    [data]="items()"
    [totalRecords]="totalCount()"
    [loading]="loading()"
    (sortChange)="onSortChange($event)"
    (pageChange)="onPageChange($event)"
    (actionClick)="onTableAction($event)"
  />
</div>
</app-page>

<app-artikel-dialog
  [visible]="dialogVisible()"
  (visibleChange)="onDialogVisibleChange($event)"
  [articleNumber]="editingRow()?.number ?? 0"
  [initialValue]="dialogInitialValue()"
  [locked]="dialogLocked()"
  [saving]="saving()"
  [serverErrors]="serverErrors()"
  [deleteError]="deleteError()"
  (save)="onDialogSave($event)"
  (cancel)="onDialogCancel()"
  (deleteRequested)="onDeleteRequested()"
/>

<app-article-status-popup
  [visible]="statusPopupVisible()"
  (visibleChange)="onStatusPopupVisibleChange($event)"
  [articleNumber]="statusPopupDetail()?.number ?? 0"
  [value]="statusPopupValue()"
  [settledAt]="statusPopupDetail()?.sellerSettledAt ?? null"
  [settlementLocked]="statusPopupSettlementLocked()"
  [saving]="statusSaving()"
  (timestampsChange)="onTimestampsChange($event)"
/>
