<div class="settings-form">
  <label for="settings-scanner-pause-ms">Scan-Pause</label>
  <app-input-group
    #scannerPauseInput
    variant="count"
    [modes]="['keyboard', 'numpad']"
    inputId="settings-scanner-pause-ms"
    (valueChange)="onValueChange($event)"
  />
  <p class="settings-form__help">{{ helpText }}</p>

  @if (fieldError()) {
    <p class="settings-form__error">{{ fieldError() }}</p>
  }

  <app-boolean-input
    variant="switch"
    [label]="releaseOnCloseLabel"
    [value]="releaseOnClose()"
    (valueChange)="onReleaseOnCloseChange($event)"
  />
  <p class="settings-form__help">{{ releaseOnCloseHelpText }}</p>

  <label for="settings-default-seller-type">Standard-Verkäufer-Typ</label>
  <p-select
    inputId="settings-default-seller-type"
    appendTo="body"
    [options]="sellerTypes()"
    optionLabel="name"
    optionValue="id"
    [showClear]="true"
    [placeholder]="defaultSellerTypePlaceholder"
    [ngModel]="defaultSellerTypeId()"
    (ngModelChange)="onDefaultSellerTypeChange($event)"
  />
  <p class="settings-form__help">{{ defaultSellerTypeHelpText }}</p>

  <p-button label="Speichern" [disabled]="saving()" (onClick)="onSave()" />
</div>
