@if (visible()) {
  <div class="dev-tools-panel">
    <h3 class="dev-tools-panel__title">Datenbank zurücksetzen</h3>
    <p class="dev-tools-panel__warning">
      ⚠ Löscht die komplette Datenbank unwiderruflich (alle Verkäufer, Artikel, Verkäufe,
      Benutzer). Nur lokal/Development sichtbar.
    </p>
    <div class="dev-tools-panel__confirm">
      <input
        pInputText
        [ngModel]="confirmText()"
        (ngModelChange)="confirmText.set($event)"
        placeholder="Tippe RESET zum Bestätigen"
        name="dev-tools-confirm"
      />
      <p-button
        severity="danger"
        label="Datenbank zurücksetzen"
        [disabled]="!canReset()"
        (onClick)="resetDatabase()"
      />
    </div>
  </div>
}
