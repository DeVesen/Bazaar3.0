<div class="intake-article-entry">
  <div class="intake-article-entry__form">
    <div class="intake-article-entry__grid">
      <div class="intake-article-entry__field intake-article-entry__field--full intake-article-entry__field--number">
        <label for="intake-article-entry-number">Artikelnummer <span class="intake-article-entry__required">*</span></label>
        <app-input-group
          #numberGroup
          inputId="intake-article-entry-number"
          variant="search"
          [modes]="['keyboard', 'camera', 'numpad']"
          [showLeftAddon]="false"
          [addonActionButtons]="true"
          [extraModeButton]="extraModeButtonConfig()"
          (valueChange)="onArticleNumberChange($event)"
          (submitted)="onArticleNumberSubmit()"
          (extraModeClicked)="onOpenRenumberPopup()"
        />
        @if (numberTakenMessage()) {
          <small class="intake-article-entry__error">{{ numberTakenMessage() }}</small>
        }
      </div>

      <div class="intake-article-entry__field intake-article-entry__field--full">
        <label for="intake-article-entry-name">Bezeichnung <span class="intake-article-entry__required">*</span></label>
        <app-input
          inputId="intake-article-entry-name"
          [value]="name()"
          [debounceMs]="0"
          [addonRight]="nameClearAddon()"
          [required]="true"
          (valueChange)="onNameChange($event)"
          (keyUp)="onNameKeyUp($event)"
          (addonClick)="onNameAddonClick($event)"
        />
      </div>

      <div class="intake-article-entry__field">
        <label for="intake-article-entry-category">Kategorie <span class="intake-article-entry__required">*</span></label>
        <app-autocomplete-create
          inputId="intake-article-entry-category"
          [options]="categoryNames()"
          [value]="category()"
          (valueChange)="onCategoryChange($event)"
          entityLabel="Kategorie"
          (entryCreated)="onCategoryCreated($event)"
        />
      </div>

      <div class="intake-article-entry__field">
        <label for="intake-article-entry-brand">Marke <span class="intake-article-entry__required">*</span></label>
        <app-autocomplete-create
          inputId="intake-article-entry-brand"
          [options]="brandNames()"
          [value]="brand()"
          (valueChange)="onBrandChange($event)"
          entityLabel="Marke"
          (entryCreated)="onBrandCreated($event)"
        />
      </div>

      <div class="intake-article-entry__field intake-article-entry__field--full">
        <label for="intake-article-entry-price">Preis <span class="intake-article-entry__required">*</span></label>
        <app-input
          inputId="intake-article-entry-price"
          [value]="priceText()"
          [debounceMs]="0"
          [addonRight]="priceAddonRight()"
          [required]="true"
          (valueChange)="onPriceChange($event)"
          (keyUp)="onPriceKeyUp($event)"
          (addonClick)="onPriceAddonClick($event)"
        />
        @if (priceNumpadVisible()) {
          <app-numpad (keyPressed)="onPriceNumpadKey($event)" (cleared)="onPriceNumpadClear()" />
        }
      </div>

      <div class="intake-article-entry__field">
        <label for="intake-article-entry-size">Größe</label>
        <app-input
          inputId="intake-article-entry-size"
          [value]="size()"
          [debounceMs]="0"
          [addonRight]="sizeClearAddon()"
          (valueChange)="onSizeChange($event)"
          (keyUp)="onSizeKeyUp($event)"
          (addonClick)="onSizeAddonClick($event)"
        />
      </div>

      <div class="intake-article-entry__field">
        <label for="intake-article-entry-color">Farbe</label>
        <app-input
          inputId="intake-article-entry-color"
          [value]="color()"
          [debounceMs]="0"
          [addonRight]="colorClearAddon()"
          (valueChange)="onColorChange($event)"
          (keyUp)="onColorKeyUp($event)"
          (addonClick)="onColorAddonClick($event)"
        />
      </div>

      <div class="intake-article-entry__field intake-article-entry__field--full">
        <label for="intake-article-entry-description">Beschreibung</label>
        <textarea
          id="intake-article-entry-description"
          pTextarea
          [ngModel]="description()"
          (ngModelChange)="onDescriptionChange($event)"
          name="description"
          rows="3"
        ></textarea>
      </div>
    </div>

    <div class="intake-article-entry__actions">
      <p-button label="Übernehmen" [disabled]="!canSave()" (onClick)="onSubmitEntry()" />
    </div>
  </div>

  <div class="intake-article-entry__session">
    <h4 class="intake-article-entry__session-title">Artikel dieser Sitzung</h4>
    <app-intake-session-list
      [items]="items()"
      [feePerItem]="feePerItem()"
      [sellerId]="sellerId()"
      [categoryOptions]="categoryNames()"
      [brandOptions]="brandNames()"
      (itemDeleted)="onItemDeleted($event)"
      (itemUpdated)="onItemUpdated($event)"
      (booked)="onBooked()"
      (bookingConflict)="onBookingConflict($event)"
      (categoryCreated)="onCategoryCreated($event)"
      (brandCreated)="onBrandCreated($event)"
    />
  </div>

  <app-intake-renumber-lookup-popup
    [visible]="renumberPopupVisible()"
    [sellerId]="sellerId()"
    (visibleChange)="onRenumberPopupVisibleChange($event)"
    (articleFound)="onArticleFoundViaRenumberPopup($event)"
  />
</div>
