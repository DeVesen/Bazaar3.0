<div class="change-password-page">
  <form (ngSubmit)="onSubmit()">
    <p-iconfield>
      <p-inputicon>
        <i class="pi pi-lock"></i>
      </p-inputicon>
      <input
        id="change-password-current"
        pInputPassword
        [(mask)]="currentPasswordMask"
        [ngModel]="currentPassword()"
        (ngModelChange)="currentPassword.set($event)"
        name="currentPassword"
        type="password"
        required
      />
      <p-inputicon (click)="currentPasswordMask.set(!currentPasswordMask())">
        <i [class]="currentPasswordMask() ? 'pi pi-eye' : 'pi pi-eye-slash'"></i>
      </p-inputicon>
    </p-iconfield>
    @if (currentPasswordError()) {
      <p class="change-password-page__error">{{ currentPasswordError() }}</p>
    }

    <p-iconfield>
      <p-inputicon>
        <i class="pi pi-lock"></i>
      </p-inputicon>
      <input
        id="change-password-new"
        pInputPassword
        [(mask)]="newPasswordMask"
        [ngModel]="newPassword()"
        (ngModelChange)="newPassword.set($event)"
        name="newPassword"
        type="password"
        required
      />
      <p-inputicon (click)="newPasswordMask.set(!newPasswordMask())">
        <i [class]="newPasswordMask() ? 'pi pi-eye' : 'pi pi-eye-slash'"></i>
      </p-inputicon>
    </p-iconfield>
    @if (newPasswordError()) {
      <p class="change-password-page__error">{{ newPasswordError() }}</p>
    }

    <p-iconfield>
      <p-inputicon>
        <i class="pi pi-lock"></i>
      </p-inputicon>
      <input
        id="change-password-confirm"
        pInputPassword
        [(mask)]="confirmPasswordMask"
        [ngModel]="confirmPassword()"
        (ngModelChange)="confirmPassword.set($event)"
        name="confirmPassword"
        type="password"
        required
      />
      <p-inputicon (click)="confirmPasswordMask.set(!confirmPasswordMask())">
        <i [class]="confirmPasswordMask() ? 'pi pi-eye' : 'pi pi-eye-slash'"></i>
      </p-inputicon>
    </p-iconfield>
    @if (newPassword().length > 0 && confirmPassword().length > 0 && !passwordsMatch()) {
      <p class="change-password-page__error">Passwörter stimmen nicht überein</p>
    }

    @if (generalError()) {
      <p class="change-password-page__error">{{ generalError() }}</p>
    }

    <p-button type="submit" label="Passwort ändern" [disabled]="!canSubmit()" />
  </form>
</div>
