<p-dialog
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  header="Abrechnen"
  [style]="{ width: '28rem' }"
>
  <div class="settlement-panel">
    <div class="settlement-panel__row">
      <span class="settlement-panel__label">Umsatz</span>
      <span class="settlement-panel__value">{{ formatCurrency(settlement().revenue) }}</span>
    </div>

    <div class="settlement-panel__row settlement-panel__row--commission">
      <span class="settlement-panel__label">Provision</span>
      <span class="settlement-panel__value">− {{ formatCurrency(settlement().commission) }}</span>
    </div>

    <div class="settlement-panel__row settlement-panel__row--total">
      <span class="settlement-panel__label">Auszahlung</span>
      <span class="settlement-panel__value">{{ formatCurrency(settlement().payout) }}</span>
    </div>

    @if (settlement().notDeliveredCount > 0) {
      <div class="settlement-panel__hint">
        <app-boolean-input
          variant="checkbox"
          [label]="settlement().notDeliveredCount + ' nicht abgegebene Artikel löschen'"
          [value]="removeNotDelivered()"
          (valueChange)="removeNotDelivered.set($event)"
        />
      </div>
    }

    @if (errorMessage()) {
      <p class="settlement-panel__error">{{ errorMessage() }}</p>
    }
  </div>

  <ng-template #footer>
    <div class="settlement-panel__footer">
      <p-button label="Abbrechen" severity="secondary" [text]="true" (onClick)="onCancel()" />
      <p-button label="Buchen" severity="primary" (onClick)="onConfirm()" />
    </div>
  </ng-template>
</p-dialog>
