<ng-template #inputField>
  <!--
    [attr.x] + `?? null` instead of plain [x]: [name] on an element with [ngModel] would bind to
    NgModel's own `name` @Input() instead of the native DOM attribute, and [id]="undefined" would
    literally render the string "undefined" as the id when unset.
  -->
  <input
    pInputText
    [attr.id]="resolvedId()"
    [attr.name]="name() ?? null"
    [attr.placeholder]="placeholder() ?? null"
    [type]="type()"
    [disabled]="disabled()"
    [required]="required()"
    [readOnly]="readOnly()"
    [ngModel]="rawValue()"
    (ngModelChange)="onTyped($event)"
    (keyup)="onKeyUp($event)"
    (keydown.enter)="onEnter()"
    (keydown)="onKeyDown($event)"
    (blur)="onBlur($event)"
  />
</ng-template>

<ng-template #addon let-addon>
  <p-inputgroup-addon [class]="addon.class" [ngStyle]="addon.style" (click)="onAddonClick(addon)">
    @switch (addon.type) {
      @case ('icon') {
        <i [class]="addon.value"></i>
      }
      @case ('button') {
        <p-button [label]="addon.value" [text]="true" />
      }
      @default {
        {{ addon.value }}
      }
    }
  </p-inputgroup-addon>
</ng-template>

<p-inputgroup>
  @for (a of addonLeft(); track a.key) {
    <ng-container [ngTemplateOutlet]="addon" [ngTemplateOutletContext]="{ $implicit: a }" />
  }

  @if (label(); as labelText) {
    <p-iftalabel>
      <ng-container [ngTemplateOutlet]="inputField" />
      <label [attr.for]="resolvedId()">
        {{ labelText }}
        @if (required()) {
          <span class="app-input__required">*</span>
        }
      </label>
    </p-iftalabel>
  } @else {
    <ng-container [ngTemplateOutlet]="inputField" />
  }

  @for (a of addonRight(); track a.key) {
    <ng-container [ngTemplateOutlet]="addon" [ngTemplateOutletContext]="{ $implicit: a }" />
  }
</p-inputgroup>
